<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d11" />
<title>公路驾驶 3D · Highway Drive</title>
<style>
  :root{
    --bg:#0b0d11;
    --panel:rgba(14,17,22,.82);
    --text:#dfe3e8;
    --muted:#8b929c;
    --line:rgba(255,255,255,.09);
    --accent:#7d8896;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#05070a; }
  body{
    font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color:var(--text);
    user-select:none;
  }
  #app{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:min(100vw, calc(100dvh * 16 / 9));
    height:min(calc(100vw * 9 / 16), 100dvh);
    overflow:hidden;
    background:#0b0d11;
  }
  #scene{ display:block; width:100%; height:100%; touch-action:none; }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .overlay[hidden]{ display:none; }

  .panel{
    width:min(360px, 100%);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px 24px 22px;
    text-align:center;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .eyebrow{
    font-size:10px; letter-spacing:.34em; color:var(--muted);
    text-transform:uppercase;
  }
  .title{
    margin:10px 0 2px;
    font-size:26px; font-weight:600; letter-spacing:.06em;
    color:#eef1f4;
  }
  .subtitle{
    margin:0 0 18px;
    font-size:11px; letter-spacing:.18em; color:var(--muted);
  }

  .btn{
    display:block; width:100%;
    font-family:inherit;
    font-size:13px; letter-spacing:.14em;
    padding:12px 18px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    color:var(--text);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn:hover{ background:rgba(255,255,255,.09); }
  .btn:active{ background:rgba(255,255,255,.13); }
  .btn + .btn{ margin-top:8px; }
  .btn.solid{
    background:rgba(255,255,255,.14);
    border-color:rgba(255,255,255,.22);
    font-weight:600;
  }
  .btn.solid:hover{ background:rgba(255,255,255,.2); }

  .kbd{
    font-family:inherit; font-size:10.5px;
    padding:1px 6px; border-radius:4px;
    border:1px solid var(--line); background:rgba(255,255,255,.05);
    color:#aeb5bf;
  }
  .tip{ margin-top:16px; font-size:11px; line-height:2; color:var(--muted); letter-spacing:.04em; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; inset:0; pointer-events:none; }
  #hud[hidden]{ display:none; }

  .bar{
    position:absolute;
    display:flex; align-items:center; gap:14px;
    font-variant-numeric:tabular-nums;
  }
  .bar.tl{ top:16px; left:20px; }
  .bar.tr{ top:16px; right:20px; pointer-events:auto; }
  .bar.bl{ bottom:18px; left:20px; }
  .bar.br{ bottom:18px; right:20px; }

  .stat{ display:flex; flex-direction:column; gap:1px; }
  .stat .k{ font-size:9px; letter-spacing:.26em; color:var(--muted); }
  .stat .v{ font-size:22px; font-weight:600; line-height:1.1; color:#e8ecf0; }
  .stat.small .v{ font-size:14px; font-weight:500; color:#b9c0c9; }

  .lives{ display:flex; gap:5px; }
  .life{
    width:16px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.14);
  }
  .life.on{ background:#c7ccd3; }

  .mini{
    font-family:inherit;
    font-size:11px; letter-spacing:.1em;
    color:#b9c0c9;
    padding:7px 12px;
    border-radius:7px;
    border:1px solid var(--line);
    background:rgba(14,17,22,.7);
    cursor:pointer;
  }
  .mini:hover{ background:rgba(30,36,44,.85); }
  .mini:active{ background:rgba(50,58,68,.9); }

  .pad{ position:absolute; inset:auto 0 0 0; display:none; padding:0 22px 26px; justify-content:space-between; align-items:flex-end; pointer-events:none; }
  .pad.on{ display:flex; }
  .pad[hidden]{ display:none; }
  .pad-side{ display:flex; gap:10px; }
  .padbtn{
    pointer-events:auto;
    width:74px; height:54px;
    border-radius:10px;
    display:grid; place-items:center;
    font-size:15px;
    letter-spacing:.08em;
    color:#c7ccd3;
    background:rgba(14,17,22,.62);
    border:1px solid var(--line);
    touch-action:none;
  }
  .padbtn:active{ background:rgba(70,80,92,.78); }
  .padbtn.gas{ color:#dfe3e8; background:rgba(40,46,54,.7); }
  .padbtn.brake{ color:#c9a8a8; }

  .toast{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    font-size:11px; letter-spacing:.12em; color:#aeb5bf;
    padding:8px 14px; border-radius:8px;
    background:rgba(14,17,22,.85);
    border:1px solid var(--line);
    opacity:0; transition:opacity .4s ease;
    pointer-events:none;
  }

  /* 撞击时的红色边缘闪光 */
  #dmg{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center,
      rgba(220,40,40,0) 45%, rgba(205,24,24,.35) 78%, rgba(178,12,12,.72) 100%);
  }
  .toast.show{ opacity:1; }

  #err{
    position:fixed; inset:0; display:none; place-items:center;
    padding:32px; text-align:center; font-size:13px; line-height:1.9;
    color:var(--muted); background:#0b0d11; z-index:50;
  }
  #err b{ color:#d98b8b; font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div id="hud" hidden>
    <div class="bar tl">
      <div class="stat">
        <span class="k">SCORE</span>
        <span class="v" id="score">0</span>
      </div>
      <div class="stat small">
        <span class="k">BEST</span>
        <span class="v" id="best">0</span>
      </div>
    </div>
    <div class="bar tr">
      <span class="mini" id="envTag" style="pointer-events:none;cursor:default">晴 · 白天</span>

      <div class="lives" id="lives"></div>
    </div>
    <div class="bar br">
      <div class="stat" style="align-items:flex-end">

      </div>
    </div>
    <button class="mini" id="btnFly" style="position:absolute;right:20px;bottom:88px;display:none;pointer-events:auto">起飞 · F</button>
  </div>

  <div class="pad" id="pad" hidden>
    <div class="pad-side">
      <div class="padbtn" id="padL">◀</div>
      <div class="padbtn" id="padR">▶</div>
    </div>
    <div class="pad-side">
      <div class="padbtn brake" id="padB">刹车</div>
      <div class="padbtn gas" id="padA">加速</div>
    </div>
  </div>

  <div class="toast" id="toast">建议横屏游玩</div>
  <div id="dmg"></div>

  <div class="overlay" id="home">
    <div class="panel">
      <div class="eyebrow">3D DRIVING</div>
      <h1 class="title">公路驾驶</h1>
      <p class="subtitle">HIGHWAY DRIVE</p>
      <div class="stat small" style="margin-bottom:18px">
        <span class="k" style="letter-spacing:.26em">最高分</span>
        <span class="v" id="homeBest">0</span>
      </div>
      <button class="btn solid" id="btnStart">开始驾驶</button>
      <button class="btn" id="btnVehicle">车型 · 公路版</button>
      <button class="btn" id="btnSettings">特殊设置</button>
      <button class="btn" id="btnSound">音效 · 开</button>
      <button class="btn" id="btnCam2">视角 · 追尾</button>
      <div class="tip">
        <span class="kbd">W</span> 加速　<span class="kbd">S</span> 刹车　<span class="kbd">A</span> <span class="kbd">D</span> 转向<br/>
        <span class="kbd">C</span> 切换视角　<span class="kbd">L</span> 灯光　<span class="kbd">F</span> 起飞　<span class="kbd">Esc</span> 暂停
      </div>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <div class="panel">
      <div class="eyebrow">OPTIONS</div>
      <h1 class="title" style="font-size:20px">特殊设置</h1>
      <p class="subtitle" style="margin-bottom:16px">作弊玩法 · 随时可关</p>
      <button class="btn" id="btnSmash">撞飞前车 · 关</button>
      <button class="btn" id="btnUltra">极速 999 · 关</button>
      <button class="btn solid" id="btnSettingsBack" style="margin-top:16px">返回主页</button>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="panel">
      <div class="eyebrow">PAUSED</div>
      <h1 class="title" style="font-size:20px">已暂停</h1>
      <button class="btn solid" id="btnResume">继续驾驶</button>
      <button class="btn" id="btnRestart2">重新开始</button>
      <button class="btn" id="btnHome2">返回主页</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <div class="eyebrow">RUN OVER</div>
      <h1 class="title" style="font-size:20px">本次行驶结束</h1>
      <div class="stat" style="margin:14px 0 6px">
        <span class="k">最终得分</span>
        <span class="v" id="finalScore" style="font-size:34px">0</span>
      </div>
      <div class="stat small" style="margin-bottom:18px">
        <span class="k" id="finalMeta">里程 0 m</span>
      </div>
      <button class="btn solid" id="btnRestart">再来一局</button>
      <button class="btn" id="btnHome">返回主页</button>
    </div>
  </div>
</div>

<div id="err">
  <div>
    <b>3D 引擎加载失败</b><br/>
    缺少 three.module.min.js。<br/>
    请确认它与 index.html 在同一目录后刷新页面。
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./three.module.min.js"

<script type="module">
import * as THREE from 'three';

/* ===================== 基础工具 ===================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const $ = (id) => document.getElementById(id);

const STORE_KEY = 'highway3d.best.v1';
const SETTINGS_KEY = 'highway3d.settings.v1';

function loadBest() {
  try { return Number(localStorage.getItem(STORE_KEY)) || 0; } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (s && typeof s === 'object') return { sfx: s.sfx !== false };
  } catch (e) {}
  return { sfx: true };
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}

/* ===================== 音效 ===================== */
const Sound = {
  ctx: null, master: null,
  on: true,
  engOsc: null, engGain: null, engFilter: null,
  rainSrc: null, rainGain: null,

  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  tone(freq, dur, gain, type) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, gain) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const len = Math.ceil(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    const g = this.ctx.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },

  cue(name) {
    if (!this.ctx) return;
    switch (name) {
      case 'crash': this.noise(0.32, 0.8); this.tone(86, 0.35, 0.45, 'sawtooth'); break;
      case 'over': this.tone(210, 0.45, 0.32, 'sawtooth'); this.tone(104, 0.8, 0.26, 'sine'); break;
      case 'start': this.tone(320, 0.09, 0.4, 'sine'); setTimeout(() => this.tone(620, 0.14, 0.4, 'sine'), 100); break;
      case 'ui': this.tone(480, 0.05, 0.22, 'sine'); break;
    }
  },

  startEngine() {
    if (!this.ctx || this.engOsc) return;
    const o = this.ctx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = 52;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 220;
    const g = this.ctx.createGain(); g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start();
    const t = this.ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(this.on ? 0.045 : 0, t + 0.4);
    this.engOsc = o; this.engGain = g; this.engFilter = f;
  },

  engineSpeed(r) {
    if (!this.engOsc || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.engOsc.frequency.setTargetAtTime(48 + r * 42, t, 0.2);
    this.engFilter.frequency.setTargetAtTime(190 + r * 300, t, 0.2);
    this.engGain.gain.setTargetAtTime(this.on ? 0.045 : 0, t, 0.2);
  },

  stopEngine() {
    if (!this.engOsc || !this.ctx) return;
    const o = this.engOsc, g = this.engGain;
    this.engOsc = null; this.engGain = null; this.engFilter = null;
    const t = this.ctx.currentTime;
    g.gain.setTargetAtTime(0, t, 0.12);
    setTimeout(() => { try { o.stop(t + 0.4); } catch (e) {} }, 420);
  },

  /* 雨声：循环白噪声 + 带通滤波，音量随雨强调节 */
  startRain() {
    if (!this.ctx || this.rainSrc) return;
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 0.4;
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    this.rainSrc = src; this.rainGain = g;
  },

  rainLevel(k) {
    if (!this.ctx) return;
    if (!this.rainSrc && k > 0.02) this.startRain();
    if (this.rainGain) this.rainGain.gain.setTargetAtTime(this.on ? k * 0.16 : 0, this.ctx.currentTime, 0.4);
  },

  setOn(v) {
    this.on = !!v;
    if (!this.on) { if (this.engGain && this.ctx) this.engGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1); }
  }
};

/* ===================== 场景常量 ===================== */
const LANE_W = 3.6;
const LANE_X = [-LANE_W, 0, LANE_W];
const ROAD_HALF = 5.5;
const SCROLL_SPAN = 320;
const CAR_HALF_W = 0.95;
const CAR_HALF_L = 2.1;
const MAX_SPEED = 58;
const ULTRA_SPEED = 999 / 3.6;   // 极速 999 km/h ≈ 277.5 m/s

/* ===================== 渲染器 / 场景 ===================== */
const canvas = $('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('err').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 55, 215);

// 程序化环境贴图，让车漆有反射
(function () {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 128;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, '#33465a');
  g.addColorStop(0.42, '#9fb2c5');
  g.addColorStop(0.5, '#1a1e24');
  g.addColorStop(1, '#0a0c10');
  x.fillStyle = g;
  x.fillRect(0, 0, 32, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose();
  pmrem.dispose();
})();

const camera = new THREE.PerspectiveCamera(68, 1, 0.1, 600);
camera.position.set(0, 3.6, 9);

const hemi = new THREE.HemisphereLight(0x9db2c8, 0x14171b, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xf2f6ff, 1.25);
sun.position.set(38, 62, 26);
scene.add(sun);

/* ---------- 昼夜天空：太阳 / 月亮 / 星星 / 云 ---------- */
const SKY = {
  day: new THREE.Color(0x8fb4d9),
  night: new THREE.Color(0x070a12),
  dusk: new THREE.Color(0xe0884c),
  grey: new THREE.Color(0x6d7885)
};
const skyCol = new THREE.Color();

const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(15, 24),
  new THREE.MeshBasicMaterial({ color: 0xfff3c4, fog: false, transparent: true, side: THREE.DoubleSide })
);
const moonDisc = new THREE.Mesh(
  new THREE.CircleGeometry(9, 24),
  new THREE.MeshBasicMaterial({ color: 0xdfe8f2, fog: false, transparent: true, opacity: 0, side: THREE.DoubleSide })
);
scene.add(sunDisc, moonDisc);

const starGeo = new THREE.BufferGeometry();
{
  const n = 220;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = rand(-420, 420);
    arr[i * 3 + 1] = rand(35, 320);
    arr[i * 3 + 2] = -rand(150, 430);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xcfd9e8, size: 1.5, sizeAttenuation: false, transparent: true, opacity: 0, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.32, fog: false });
const clouds = [];
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(rand(4, 8), 10, 8), cloudMat);
    s.scale.y = 0.45;
    s.position.set(j * rand(5, 8) - 7, rand(-1, 1.5), rand(-2, 2));
    g.add(s);
  }
  g.position.set(rand(-180, 180), rand(45, 85), -rand(200, 330));
  scene.add(g);
  clouds.push({ g, v: rand(0.5, 1.4) });
}

/* ---------- 弯道路径 ---------- */
// 路的中心线随里程横向摆动，形成连续的 S 弯
const CURVE_A = 12, CURVE_K = 0.006, CURVE_B = 4.2, CURVE_K2 = 0.0175, CURVE_P2 = 1.2;
function pathX(s) {
  return CURVE_A * Math.sin(s * CURVE_K) + CURVE_B * Math.sin(s * CURVE_K2 + CURVE_P2);
}
// d：相对玩家的前方距离（正=前方），返回相对玩家的横向偏移
function roadOffset(d) { return pathX(state.dist + d) - pathX(state.dist); }
// 该处路面的朝向角
function roadYaw(d) {
  const e = 1.2;
  const k = (pathX(state.dist + d + e) - pathX(state.dist + d - e)) / (2 * e);
  return -Math.atan(k);
}

/* ---------- 地面与路面 ---------- */
function roadTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const x = c.getContext('2d');

      : 'rgba(0,0,0,' + (0.03 + Math.random() * 0.07) + ')';
    x.fillRect(Math.random() * 512, Math.random() * 256, 2, 2);
  }
  // 两侧路肩
  const sh = Math.round(512 * 1.1 / ((ROAD_HALF + 1.1) * 2));
  x.fillStyle = '#23272d';
  x.fillRect(0, 0, sh, 256);
  x.fillRect(512 - sh, 0, sh, 256);
  // 白色边线
  x.fillStyle = 'rgba(206,214,222,0.72)';
  x.fillRect(sh + 3, 0, 4, 256);
  x.fillRect(512 - sh - 7, 0, 4, 256);

  const t = new THREE.CanvasTexture(c);
  t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// 周期性值噪声：保证贴图四边无缝，平铺时看不到接缝
function hash2(ix, iy) {
  let h = (ix * 374761393 + iy * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h >>> 0) / 4294967295;
}
function pnoise(x, y, period) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const w = (i) => ((i % period) + period) % period;
  const a = hash2(w(ix), w(iy));
  const b = hash2(w(ix + 1), w(iy));
  const c = hash2(w(ix), w(iy + 1));
  const d = hash2(w(ix + 1), w(iy + 1));
  const ab = a + (b - a) * sx;
  const cd = c + (d - c) * sx;
  return ab + (cd - ab) * sy;
}

function grassTexture() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');

  // 底色：三层噪声叠加出深浅草斑，颜色收在自然草绿范围
  const img = x.createImageData(S, S);
  const d = img.data;
  for (let py = 0; py < S; py++) {
    for (let px = 0; px < S; px++) {
      const u = px / S, v = py / S;
      const n = pnoise(u * 5, v * 5, 5) * 0.55
              + pnoise(u * 13, v * 13, 13) * 0.28
              + pnoise(u * 37, v * 37, 37) * 0.17;
      const t1 = n * 1.5;
      const i = (py * S + px) * 4;
      d[i] = 34 + t1 * 94;
      d[i + 1] = 56 + t1 * 78;
      d[i + 2] = 26 + t1 * 44;
      d[i + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);

  // 大块色斑：枯草黄 / 深绿 / 踩秃的裸土，打散均匀感
  for (let i = 0; i < 54; i++) {
    const px = Math.random() * S, py = Math.random() * S;
    const r = rand(22, 78);
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    const k = Math.random();
    if (k < 0.3) g.addColorStop(0, 'rgba(146,132,72,0.34)');
    else if (k < 0.65) g.addColorStop(0, 'rgba(34,58,30,0.38)');
    else g.addColorStop(0, 'rgba(104,124,60,0.30)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }

  // 草叶：按噪声成簇的细短笔触，明暗与色相都分层
  for (let i = 0; i < 30000; i++) {
    const px = Math.random() * S, py = Math.random() * S;
    if (Math.random() > pnoise(px / S * 13, py / S * 13, 13) * 0.9 + 0.1) continue;
    const len = rand(2, 9);
    const lean = rand(-0.4, 0.4);
    const k = Math.random();
    x.strokeStyle = k > 0.78
      ? 'rgba(178,192,104,0.62)'
      : k > 0.5
        ? 'rgba(138,164,78,0.58)'
        : k > 0.22
          ? 'rgba(84,112,52,0.55)'
          : 'rgba(38,58,32,0.5)';
    x.lineWidth = Math.random() > 0.75 ? 1.5 : 1;
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + lean * len, py - len);
    x.stroke();
  }

  // 零星干草 / 裸土
  for (let i = 0; i < 1600; i++) {
    x.fillStyle = Math.random() > 0.5 ? 'rgba(160,144,86,0.4)' : 'rgba(82,66,44,0.34)';
    x.fillRect(Math.random() * S, Math.random() * S, rand(1, 2.4), rand(1, 2.4));
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30, 36);          // 单块约 30m，放大平铺尺度抑制高速摩尔纹
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function layoutRoad() {
  const base = pathX(state.dist);
  for (let i = 0; i <= ROAD_SEG; i++) {

    roadPos[k + 2] = z;
    roadPos[k + 3] = o + ROAD_HALF_W;
    roadPos[k + 4] = 0;
    roadPos[k + 5] = z;
  }
  roadGeo.attributes.position.needsUpdate = true;
}

  // 前后贯穿灯带
  const barF = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.065, 0.05), new THREE.MeshBasicMaterial({ color: 0xe9f3ff }));
  barF.position.set(0, 0.88, -2.17);
  g.add(barF);
  const barR = new THREE.Mesh(new THREE.BoxGeometry(1.76, 0.065, 0.05), new THREE.MeshBasicMaterial({ color: 0xff4b4b }));
  barR.position.set(0, 0.90, 2.17);
  g.add(barR);

  // 侧裙 / 后视镜 / 门缝
  for (const s of [-1, 1]) {
    const sill = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.10, 2.70), dark);
    sill.position.set(s * 0.965, 0.40, 0.05);

    mir.position.set(s * 0.99, 1.06, -0.70);
    g.add(mir);
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.32, 0.02), dark);
    seam.position.set(s * 0.972, 0.72, 0.05);
    g.add(seam);
  }

  // 车轮
  for (const [x, z] of [[-0.92, -1.36], [0.92, -1.36], [-0.92, 1.36], [0.92, 1.36]]) {
    const w = new THREE.Mesh(GEO.wheel, wheelMat);
    w.position.set(x, 0.36, z);
    g.add(w);
    const r = new THREE.Mesh(GEO.rim, rimMat);
    r.position.set(x + (x > 0 ? 0.006 : -0.006), 0.36, z);
    g.add(r);
  }

  // 四个悬浮推进舱（起飞时展开旋转）
  const pods = [];
  for (const [x, z] of [[-1.02, -1.62], [1.02, -1.62], [-1.02, 1.62], [1.02, 1.62]]) {
    const grp = new THREE.Group();
    grp.position.set(x, 0.42, z);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.07, 0.30), dark);
    arm.position.set(-Math.sign(x) * 0.14, 0, 0);
    grp.add(arm);
    const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.10, 12), dark);
    housing.position.y = 0.06;

    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.24, 18), glowMat);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 0.115;
    grp.add(disc);
    grp.visible = false;
    g.add(grp);
    pods.push({ group: grp, disc });
  }

  const sh = new THREE.Mesh(GEO.shadow, shadowMat);
  sh.rotation.x = -Math.PI / 2;
  sh.scale.set(0.74, 1.5, 1);
  sh.position.y = 0.01;
  g.add(sh);

  return { group: g, pods, shadow: sh };
}

/* ---------- 仪表盘贴图 ---------- */
function makeDialTexture(label) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');

  // 盘面（上亮下暗，微微内凹）
  const g = x.createRadialGradient(128, 96, 8, 128, 128, 130);
  g.addColorStop(0, '#39414b');
  g.addColorStop(0.68, '#262c34');
  g.addColorStop(1, '#181d22');
  x.fillStyle = g;
  x.beginPath(); x.arc(128, 128, 126, 0, Math.PI * 2); x.fill();

  // 外圈
  x.strokeStyle = '#7d8793'; x.lineWidth = 8;
  x.beginPath(); x.arc(128, 128, 118, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = '#4e5762'; x.lineWidth = 2;
  x.beginPath(); x.arc(128, 128, 96, 0, Math.PI * 2); x.stroke();

  // 刻度
  x.lineCap = 'round';
  for (let i = 0; i <= 10; i++) {
    const a = (135 + i * 27) * Math.PI / 180;
    const major = i % 5 === 0;
    x.strokeStyle = major ? '#e4eaf1' : '#98a3af';
    x.lineWidth = major ? 6 : 4;
    const r1 = major ? 78 : 90;
    x.beginPath();
    x.moveTo(128 + Math.cos(a) * r1, 128 + Math.sin(a) * r1);
    x.lineTo(128 + Math.cos(a) * 112, 128 + Math.sin(a) * 112);
    x.stroke();
  }

  // 数字
  x.fillStyle = '#c8d1dc';
  x.font = '600 21px system-ui, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  for (let i = 0; i <= 10; i += 2) {
    const a = (135 + i * 27) * Math.PI / 180;
    x.fillText(String(i), 128 + Math.cos(a) * 62, 128 + Math.sin(a) * 62);
  }

  // 底部标签
  x.fillStyle = '#98a3af';
  x.font = '600 17px system-ui, sans-serif';
  x.fillText(label, 128, 182);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

function makeWiper(px) {
  const g = new THREE.Group();
  g.position.set(px, -0.19, -0.93);
  g.rotation.x = -0.30;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.007, 0.007), CK.panelDeep);

  g.add(arm);

  blade.position.set(0.27, 0.012, 0);
  g.add(blade);
  g.rotation.z = 0.05;
  cockpit.add(g);
  return g;
}
const wiperL = makeWiper(-0.62);
const wiperR = makeWiper(-0.24);
let wiperPhase = 0;

function updateWipers(dt, rainK) {
  const on = rainK > 0.08;   // 只有下雨才刮，晴天收起
  if (on) {
    wiperL.visible = true; wiperR.visible = true;
    tWiperL.visible = true; tWiperR.visible = true;
    wiperPhase += dt * (2.0 + rainK * 1.2);
    const a = 0.05 + Math.abs(Math.sin(wiperPhase)) * 1.05;
    wiperL.rotation.z = a;
    wiperR.rotation.z = a;
    tWiperL.rotation.z = a;
    tWiperR.rotation.z = a;
  } else {
    wiperPhase = 0;
    wiperL.rotation.z = 0.05;
    wiperR.rotation.z = 0.05;
    tWiperL.rotation.z = 0.05;
    tWiperR.rotation.z = 0.05;
    wiperL.visible = false;
    wiperR.visible = false;
    tWiperL.visible = false;
    tWiperR.visible = false;
  }
}

// 方向盘与仪表动画
function updateCockpit() {
  wheelGroup.rotation.z = clamp(-player.vx * 0.095, -1.1, 1.1);
  const t = clamp(state.speed / MAX_SPEED, 0, 1);
  dialSpeed.rotation.z = -(135 + t * 270) * Math.PI / 180;
  const rpm = clamp(t * 0.82 + (input.accel ? 0.18 : 0), 0, 1);
  dialRpm.rotation.z = -(135 + rpm * 270) * Math.PI / 180;

}

    w.position.set(0, 0.30, z);

    g.add(r);
  }
  const lf = new THREE.Mesh(GEO.lampF, headMat);

}

function updateSparks(dt) {

    sparkPos[i * 3] += sparkVel[i * 3] * dt;
    sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
    sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;

function spawnFlyParticle() {
  let idx = -1;
  for (let i = 0; i < FLY_N; i++) if (flyLife[i] <= 0) { idx = i; break; }
  if (idx < 0) return;

    pod.group.position.x + rand(-0.22, 0.22),
    pod.group.position.y - 0.02,
    pod.group.position.z + rand(-0.22, 0.22)
  );

  flyLife[idx] = rand(0.30, 0.60);
  flyPos[idx * 3] = _flyV.x;
  flyPos[idx * 3 + 1] = _flyV.y;
  flyPos[idx * 3 + 2] = _flyV.z;
  flyVel[idx * 3] = rand(-0.9, 0.9);
  flyVel[idx * 3 + 1] = rand(-2.6, -1.0);
  flyVel[idx * 3 + 2] = rand(-0.9, 0.9);
}

function updateFlyFx(dt, emitting) {
  if (emitting) {
    teslaRig.group.updateMatrixWorld(true);
    flyEmit += dt * 190;
    while (flyEmit >= 1) { flyEmit -= 1; spawnFlyParticle(); }
  } else {
    flyEmit = 0;
  }
  let live = false;
  for (let i = 0; i < FLY_N; i++) {
    if (flyLife[i] <= 0) continue;
    live = true;
    flyLife[i] -= dt;
    if (flyLife[i] <= 0) {
      flyPos[i * 3 + 1] = -999;
      flyCol[i * 3] = flyCol[i * 3 + 1] = flyCol[i * 3 + 2] = 0;
      continue;
    }
    flyPos[i * 3] += flyVel[i * 3] * dt;
    flyPos[i * 3 + 1] += flyVel[i * 3 + 1] * dt;
    flyPos[i * 3 + 2] += flyVel[i * 3 + 2] * dt;
    flyVel[i * 3 + 1] -= 0.9 * dt;   // 尾焰逐渐减速下落
    const k = clamp(flyLife[i] / 0.60, 0, 1);
    flyCol[i * 3] = 0.50 * k;
    flyCol[i * 3 + 1] = 0.88 * k;
    flyCol[i * 3 + 2] = 1.00 * k;
  }
  if (live || emitting) {
    flyGeo.attributes.position.needsUpdate = true;
    flyGeo.attributes.color.needsUpdate = true;
  }
}

/* ===================== 更新逻辑 ===================== */
function activeCars() {
  const out = [];
  for (const c of trafficPool) if (c.active) out.push(c);
  return out;
}

function spawnTraffic() {
  // 随机挑一个空闲车位，否则总是复用数组前面的轿车，大车永远轮不到
  const idle = [];
  for (const c of trafficPool) if (!c.active) idle.push(c);
  if (!idle.length) return;
  const free = idle[Math.floor(Math.random() * idle.length)];
  const lane = Math.floor(Math.random() * 3);
  for (const c of activeCars()) {
    if (Math.abs(c.x - LANE_X[lane]) < 0.5 && c.d < 60 + c.halfL) return;
  }
  free.active = true;
  free.x = LANE_X[lane];
  free.d = 170;
  const kd = TRAFFIC_KINDS[free.kind];
  free.v = rand(kd.vMin, kd.vMax);
  free.scored = false;
  free.group.position.set(free.x, 0, -free.d);
  free.group.visible = true;
}

// 开局预置一队车流，四种车型都会出现，不会开局空路
function seedTraffic() {
  const plan = [
    { kind: 'truck', lane: 0, d: 42 },
    { kind: 'car',   lane: 1, d: 64 },
    { kind: 'bus',   lane: 2, d: 88 },
    { kind: 'moto',  lane: 0, d: 112 },
    { kind: 'car',   lane: 1, d: 136 },
    { kind: 'truck', lane: 2, d: 160 }
  ];
  for (const p of plan) {
    const c = trafficPool.find((o) => !o.active && o.kind === p.kind);
    if (!c) continue;
    const kd = TRAFFIC_KINDS[p.kind];
    c.active = true;
    c.x = LANE_X[p.lane];
    c.d = p.d;
    c.v = rand(kd.vMin, kd.vMax);
    c.scored = false;
    c.group.position.set(c.x, 0, -c.d);
    c.group.rotation.y = roadYaw(c.d);
    c.group.visible = true;
  }
}

function hit() {

function endRun() {

    state.best = state.score;
    saveBest(state.best);
  }

  $('finalMeta').textContent = '里程 ' + fmt(Math.round(state.dist)) + ' m · 最高分 ' + fmt(state.best);
  show('over', true);
  show('hud', false);

}

function update(dt) {
  state.time += dt;

  // 油门 / 刹车：自己控制车速，松油门靠惯性滑行，刹车逐渐停住
  const maxSpd = state.ultra ? ULTRA_SPEED : MAX_SPEED;
  if (input.accel) {
    state.speed = Math.min(maxSpd, state.speed + (state.ultra ? 42 : 12) * dt);
  } else if (input.brake) {
    state.speed = Math.max(0, state.speed - (state.ultra ? 70 : 30) * dt);
  } else {
    state.speed = Math.max(0, state.speed - (state.ultra ? 26 : 7.5) * dt);
  }
  if (state.speed < 0.15) state.speed = 0;

  state.dist += state.speed * dt;
  state.score = Math.floor(state.dist) + state.bonus;

  const diff = clamp(state.speed / MAX_SPEED, 0, 1);

  // 转向
  let ax = 0;
  if (input.left) ax -= 1;
  if (input.right) ax += 1;

  if (ax !== 0) player.vx += ax * 26 * dt;
  else if (input.targetX !== null) {
    const want = clamp((input.targetX - player.x) * 3.2, -9, 9);
    player.vx += (want - player.vx) * Math.min(1, 9 * dt);
  }
  player.vx *= Math.pow(0.9, dt * 60);
  player.vx = clamp(player.vx, -9, 9);
  player.x += player.vx * dt;
  if (player.x < -3.85) { player.x = -3.85; player.vx = 0; }
  if (player.x > 3.85) { player.x = 3.85; player.vx = 0; }

  player.group.position.x = player.x;
  player.group.rotation.z = -player.vx * 0.012;
  player.group.rotation.y = roadYaw(0) - player.vx * 0.022;

  // 特斯拉飞车：F 键切换起飞 / 降落
  if (state.vehicle === 'tesla' && state.flying) {
    state.alt = Math.min(FLY_MAX, state.alt + dt * 3.4);
  } else {
    state.alt = Math.max(0, state.alt - dt * 2.6);
  }
  const altY = state.vehicle === 'tesla' ? state.alt : 0;
  player.group.position.y = altY + (altY > 0.15 ? Math.sin(state.time * 3.4) * 0.05 : 0);

  // 推进舱：升空时展开并旋转发光圆盘；阴影始终留在地面上
  const podsOn = state.vehicle === 'tesla' && altY > 0.05;
  for (const p of teslaRig.pods) {
    p.group.visible = podsOn;
    if (podsOn) p.disc.rotation.z += dt * 9;
  }
  teslaRig.shadow.position.y = -altY + 0.02;
  const shk = clamp(1 - altY * 0.10, 0.6, 1);
  teslaRig.shadow.scale.set(0.74 * shk, 1.5 * shk, 1);
  // 车灯光斑留在路面
  beam.position.y = -altY + 0.03;

  // 推进器粒子 + 地面蓝色光晕
  updateFlyFx(dt, podsOn);
  flyGlow.position.set(player.group.position.x, 0.045, player.group.position.z - 0.2);
  flyGlow.material.opacity = podsOn ? clamp(0.50 - altY * 0.05, 0.14, 0.50) : 0;
  flyGlow.scale.setScalar(clamp(1 + altY * 0.12, 1, 1.75));

  if (state.inv > 0) state.inv = Math.max(0, state.inv - dt);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 2.2);
  // 车内视角时隐藏整车外壳（否则车顶/引擎盖会堵在座舱里）
  player.group.visible = camMode !== 3 && !(state.inv > 0 && Math.floor(state.time * 12) % 2 === 0);

  // 生成
  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnTraffic();
    state.spawnT = Math.max(0.5, rand(0.85, 1.5) - diff * 0.35);
  }

  // 车流
  for (const c of trafficPool) {
    if (!c.active) continue;

    // 被撞飞的车：翻滚着飞出画面
    if (c.knocked) {
      c.knockT -= dt;
      c.kyV -= 9.0 * dt;
      c.kx += c.kxV * dt;
      c.ky += c.kyV * dt;
      c.kz += c.kzV * dt;
      c.group.position.set(c.kx, Math.max(0.1, c.ky), c.kz);
      c.group.rotation.y += c.kRotV * dt;
      c.group.rotation.x += c.kRotV2 * dt;
      c.group.rotation.z += c.kRotV * 0.5 * dt;
      if (c.knockT <= 0) {
        c.active = false;
        c.knocked = false;
        c.group.visible = false;
        c.group.rotation.set(0, 0, 0);
        c.group.position.y = 0;
      }
      continue;
    }

    c.d -= (state.speed - c.v) * dt;
    c.group.position.set(roadOffset(c.d) + c.x, 0, -c.d);
    c.group.rotation.y = roadYaw(c.d);

    // 被甩在后面的车多留一会儿，减速后它们会追上来
    if (c.d < -70 || c.d > 260) {
      c.active = false;
      c.group.visible = false;
      continue;
    }
    if (!c.scored && c.d < -4) { c.scored = true; state.bonus += TRAFFIC_KINDS[c.kind].score; }

    if (state.inv <= 0 && state.alt < 2.9 &&
        Math.abs(c.x - player.x) < CAR_HALF_W + c.halfW - 0.2 &&
        Math.abs(c.d) < CAR_HALF_L + c.halfL - 0.3) {
      // 后车追尾不受伤害：把它顶在车尾后面，不扣血
      if (c.d < 0) {
        c.d = -(CAR_HALF_L + c.halfL - 0.2);
        c.group.position.set(roadOffset(c.d) + c.x, 0, -c.d);
        c.group.rotation.y = roadYaw(c.d);
        continue;
      }

      // 撞飞前车模式：前车翻滚着飞出去，自己不掉血
      if (state.smash) {
        c.knocked = true;
        c.knockT = 1.15;
        c.kx = c.group.position.x;
        c.ky = 0.2;
        c.kz = c.group.position.z;
        c.kxV = (c.x >= player.x ? 1 : -1) * rand(2.2, 4.5);
        c.kyV = rand(4.2, 6.5);
        c.kzV = -rand(7, 11);
        c.kRotV = rand(-9, 9);
        c.kRotV2 = rand(-6, 6);
        state.bonus += TRAFFIC_KINDS[c.kind].score;
        state.shake = Math.max(state.shake, 0.32);
        burstSparks(c.group.position.x, c.group.position.z);
        Sound.cue('crash');
        continue;
      }

      hit();
      if (state.phase !== 'running') return;
    }
  }

  renderHud();
}

function scrollWorld(dt) {
  const d = (state.phase === 'running' ? state.speed : 8) * dt;

  layoutRoad();

  for (let i = 0; i < DASH_COUNT; i++) {
    dashD[i] -= d;
    if (dashD[i] < -24) dashD[i] += SCROLL_SPAN;
    const dd = dashD[i];
    const x = roadOffset(dd) + (i % 2 === 0 ? -LANE_W / 2 : LANE_W / 2);
    _euler.set(0, roadYaw(dd), 0);
    _q.setFromEuler(_euler);
    _pos.set(x, 0.02, -dd);
    _m4.compose(_pos, _q, _one);
    dashMesh.setMatrixAt(i, _m4);
  }
  dashMesh.instanceMatrix.needsUpdate = true;

  for (const p of posts) {
    p.d -= d;
    if (p.d < -24) p.d += SCROLL_SPAN;
    p.group.position.set(roadOffset(p.d) + p.side * (ROAD_HALF + 2.4), 0, -p.d);
  }

  for (const s of signs) {
    s.d -= d;
    if (s.d < -18) s.d += SCROLL_SPAN;
    s.group.position.set(roadOffset(s.d) + s.side * (ROAD_HALF + 2.2), 0, -s.d);
    s.group.rotation.y = roadYaw(s.d);
  }

  for (const g of gantries) {
    g.d -= d;
    if (g.d < -18) g.d += SCROLL_SPAN;
    g.group.position.set(roadOffset(g.d), 0, -g.d);
    g.group.rotation.y = roadYaw(g.d);
  }

  // 树木：跟着路滚动，并按弯道切线摆正
  for (let i = 0; i < trees.length; i++) {
    const t = trees[i];
    t.d -= d;
    if (t.d < -26) t.d += SCROLL_SPAN;
    _euler.set(0, roadYaw(t.d) + t.rot, 0);
    _q.setFromEuler(_euler);
    _tpos.set(roadOffset(t.d) + t.side * t.off, 0, -t.d);
    _tscl.setScalar(t.scl);
    _m4.compose(_tpos, _q, _tscl);
    trunkMesh.setMatrixAt(i, _m4);
    leafA.setMatrixAt(i, _m4);
    leafB.setMatrixAt(i, _m4);
  }
  trunkMesh.instanceMatrix.needsUpdate = true;
  leafA.instanceMatrix.needsUpdate = true;
  leafB.instanceMatrix.needsUpdate = true;

  // 城镇：跟着路一起滚动
  for (const t of towns) {
    t.d -= d;
    if (t.d < -55) t.d += SCROLL_SPAN;
    t.group.position.set(roadOffset(t.d), 0, -t.d);
    t.group.rotation.y = roadYaw(t.d);
  }

  // 斜拉桥（每 1000 米一座）
  for (const p of pylons) {
    p.d -= d;
    if (p.d < -60) p.d += BRIDGE_SPAN;
    p.group.position.set(roadOffset(p.d), 0, -p.d);
    p.group.rotation.y = roadYaw(p.d);
  }
}

/* ===================== 相机 ===================== */
function updateCamera(dt) {
  const inCockpit = camMode === 3 && (state.phase === 'running' || state.phase === 'paused');
  const tesla = state.vehicle === 'tesla';
  cockpit.visible = inCockpit && !tesla;
  teslaCockpit.visible = inCockpit && tesla;

  if (state.phase === 'home' || state.phase === 'over') {
    const a = state.time * 0.28;
    camGoal.set(Math.sin(a) * 8.5, 3.4 + Math.sin(a * 0.7) * 0.5, Math.cos(a) * 8.5);
    lookGoal.set(0, 0.9, 0);
  } else {
    const m = CAM_MODES[camMode];
    const px = player.x * m.follow;
    const altY = state.vehicle === 'tesla' ? state.alt : 0;
    camGoal.set(px + m.pos.x, m.pos.y + altY, m.pos.z);
    lookGoal.set(px + m.look.x, m.look.y + altY, m.look.z);
  }

  const m = CAM_MODES[camMode];
  const k = Math.min(1, dt * (state.phase === 'running' || state.phase === 'paused' ? m.speed : 3));
  camera.position.lerp(camGoal, k);
  camLook.lerp(lookGoal, k);

  let sx = 0, sy = 0, sroll = 0;
  if (state.shake > 0) {
    sx = (Math.random() - 0.5) * state.shake * 0.85;
    sy = (Math.random() - 0.5) * state.shake * 0.70;
    sroll = (Math.random() - 0.5) * state.shake * 0.045;
  }

  camera.position.x += sx;
  camera.position.y += sy;
  camera.lookAt(camLook.x, camLook.y, camLook.z);
  camera.rotateZ(sroll);

  // 跟着弯道一起偏转（车头朝向路面切线，镜头跟着转）
  const yaw = state.phase === 'home' || state.phase === 'over' ? 0 : roadYaw(0);
  camera.rotateY(yaw);

  const targetFov = state.phase === 'home' || state.phase === 'over' ? 60 : CAM_MODES[camMode].fov;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 5);
  camera.updateProjectionMatrix();
}

/* ===================== 昼夜 & 天气 ===================== */
const DAY_LEN = 600;   // 一昼夜时长（秒）：10 分钟一圈，节奏舒缓
const WEATHER_DEFS = {
  sunny:  { label: '晴',   fogK: 0,    dimK: 0,    rainK: 0, cloudK: 0.25 },
  cloudy: { label: '多云', fogK: 0.15, dimK: 0.35, rainK: 0, cloudK: 0.9 },
  fog:    { label: '雾',   fogK: 1,    dimK: 0.3,  rainK: 0, cloudK: 0.5 },
  rain:   { label: '雨',   fogK: 0.45, dimK: 0.5,  rainK: 1, cloudK: 0.85 }
};
const weather = { cur: 'sunny', next: null, k: 0, timer: rand(70, 100) };
let lightsMode = 0;   // 0=自动（夜间亮） 1=常开 2=关闭

// 天气权重：晴最多，雨很少（约 2%）
const WEATHER_WEIGHTS = { sunny: 0.60, cloudy: 0.28, fog: 0.10, rain: 0.02 };
function pickWeather(exclude) {
  const names = Object.keys(WEATHER_DEFS).filter((n) => n !== exclude);
  const total = names.reduce((s, n) => s + WEATHER_WEIGHTS[n], 0);
  let r = Math.random() * total;
  for (const n of names) {
    r -= WEATHER_WEIGHTS[n];
    if (r <= 0) return n;
  }
  return names[0];
}

/* ---------- 雨滴粒子（挂在相机上） ---------- */
const RAIN_N = 420;
const rainPos = new Float32Array(RAIN_N * 3);
const rainVel = new Float32Array(RAIN_N);
for (let i = 0; i < RAIN_N; i++) {
  rainPos[i * 3] = rand(-16, 16);
  rainPos[i * 3 + 1] = rand(-2, 22);
  rainPos[i * 3 + 2] = rand(-46, -3);
  rainVel[i] = rand(20, 30);
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({ color: 0x9fb8cc, size: 0.09, transparent: true, opacity: 0, depthWrite: false });
const rainPts = new THREE.Points(rainGeo, rainMat);
rainPts.visible = false;
rainPts.frustumCulled = false;
camera.add(rainPts);

function updateRain(dt, rainK) {
  if (rainK < 0.02) { rainPts.visible = false; rainMat.opacity = 0; return; }
  rainPts.visible = true;
  rainMat.opacity = rainK * 0.55;
  const wind = 2 + state.speed * 0.12;
  for (let i = 0; i < RAIN_N; i++) {
    rainPos[i * 3 + 1] -= rainVel[i] * dt;
    rainPos[i * 3] -= wind * dt;
    if (rainPos[i * 3 + 1] < -2) {
      rainPos[i * 3 + 1] = rand(18, 24);
      rainPos[i * 3] = rand(-16, 16);
      rainPos[i * 3 + 2] = rand(-46, -3);
    }
    if (rainPos[i * 3] < -17) rainPos[i * 3] += 34;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

const _c1 = new THREE.Color();
const _c2 = new THREE.Color();
let envTagCache = '';
let screenT = 0;

function updateEnv(dt) {
  state.dayT = (state.dayT + dt / DAY_LEN) % 1;

  // 随机切换天气（3.5 秒平滑过渡，不会硬切）
  weather.timer -= dt;
  if (weather.next === null && weather.timer <= 0) {
    weather.next = pickWeather(weather.cur);
    weather.k = 0;
  }
  if (weather.next !== null) {
    weather.k = Math.min(1, weather.k + dt / 3.5);
    if (weather.k >= 1) {
      weather.cur = weather.next;
      weather.next = null;
      // 雨天持续时间更短，其他天气给更长的好天气窗口
      weather.timer = weather.cur === 'rain' ? rand(14, 20) : rand(65, 95);
    }
  }
  const wa = WEATHER_DEFS[weather.cur];
  const wb = weather.next ? WEATHER_DEFS[weather.next] : wa;
  const kw = weather.next ? (1 - Math.cos(weather.k * Math.PI)) / 2 : 0;
  const fogK = wa.fogK + (wb.fogK - wa.fogK) * kw;
  const dimK = wa.dimK + (wb.dimK - wa.dimK) * kw;
  const rainK = wa.rainK + (wb.rainK - wa.rainK) * kw;
  const cloudK = wa.cloudK + (wb.cloudK - wa.cloudK) * kw;

  // 昼夜权重：elev 为太阳高度，nightK 夜间权重，duskK 晨昏权重
  const elev = Math.sin(state.dayT * Math.PI * 2);
  const nightK = clamp((0.12 - elev) / 0.35, 0, 1);
  const duskK = clamp(1 - Math.abs(elev) / 0.26, 0, 1) * (1 - nightK);

  // 天空 / 雾（夜里也不会全黑，保证能看清路）
  skyCol.copy(SKY.day).lerp(SKY.night, nightK).lerp(SKY.dusk, duskK * 0.5).lerp(SKY.grey, dimK * 0.55);
  scene.background = skyCol;
  scene.fog.color.copy(skyCol);
  scene.fog.near = (55 - 27 * fogK) * (1 - nightK * 0.18);
  scene.fog.far = (215 - 100 * fogK) * (1 - nightK * 0.22);

  // 光照
  hemi.intensity = (1.0 - nightK * 0.72) * (1 - dimK * 0.22);
  hemi.color.copy(_c1.set(0x9db2c8).lerp(_c2.set(0x2c3648), nightK));
  sun.intensity = Math.max(0.05, 1.25 * (1 - nightK) * (1 - dimK * 0.5)) + nightK * 0.14;
  sun.color.copy(_c1.set(0xf2f6ff).lerp(_c2.set(0xffab5e), duskK * 0.8).lerp(_c2.set(0x93a8d8), nightK));
  const sa = state.dayT * Math.PI * 2;
  sun.position.set(Math.cos(sa) * 70, Math.max(16, Math.sin(sa) * 90), 26);

  // 天体
  sunDisc.position.set(Math.cos(sa) * 160, Math.sin(sa) * 250, -340);
  sunDisc.material.opacity = clamp(elev + 0.15, 0, 1) * (1 - dimK * 0.55);
  moonDisc.position.set(Math.cos(sa + Math.PI) * 150, Math.sin(sa + Math.PI) * 220, -340);
  moonDisc.material.opacity = nightK * (1 - dimK * 0.4);
  starMat.opacity = nightK * (1 - dimK * 0.5) * (1 - rainK * 0.6);

  // 云
  cloudMat.opacity = 0.20 + cloudK * 0.5;
  cloudMat.color.copy(_c1.set(0xffffff).lerp(_c2.set(0x7d8792), clamp(dimK + nightK * 0.5, 0, 1)));
  for (const c of clouds) {
    c.g.position.x += c.v * dt;
    if (c.g.position.x > 210) c.g.position.x = -210;
  }

  // 远山：跟随昼夜变暗，起雾/下雨时淡化
  mtnMatFar.color.copy(_c1.set(0x93aac0).lerp(_c2.set(0x141c2e), nightK).lerp(_c2.set(0x76818f), dimK * 0.55));
  mtnMatNear.color.copy(_c1.set(0x4e6b57).lerp(_c2.set(0x0f1712), nightK).lerp(_c2.set(0x5b665b), dimK * 0.45));
  const mtnVis = 1 - clamp(fogK * 0.8 + rainK * 0.15, 0, 0.9);
  mtnMatFar.opacity = mtnVis * 0.95;
  mtnMatNear.opacity = mtnVis;

  // 路灯 / 车灯 / 路牌夜间变化
  lampMat.emissiveIntensity = 0.15 + nightK * 2.4;
  lampMat.color.copy(_c1.set(0xdfe6ee).lerp(_c2.set(0xffd9a0), nightK));
  headMat.emissiveIntensity = 1.8 + nightK * 1.6;
  tailMat.emissiveIntensity = 1.2 + nightK * 0.9;
  // 车灯：0 自动（天黑自动亮） / 1 常开 / 2 关闭
  const lv = lightsMode === 2 ? 0 : lightsMode === 1 ? 1 : nightK;
  beam.material.opacity = lv * 0.88;
  headLight.intensity = 380 * lv;
  headLight.position.x = player.x;
  headLight.position.y = 1.0 + (state.vehicle === 'tesla' ? state.alt : 0);
  headLight.target.position.x = player.x;
  for (const m of signFaceMats) m.color.setScalar(1 - nightK * 0.5);

  // 雨 & 雨刷 & 雨声
  updateRain(dt, rainK);
  updateWipers(dt, rainK);
  Sound.rainLevel(rainK * (state.phase === 'running' ? 1 : 0.35));

  // HUD 环境标签
  const wName = (weather.next && weather.k > 0.5) ? wb.label : wa.label;
  const tName = nightK > 0.6 ? '夜晚' : (elev > 0.25 ? '白天' : (state.dayT < 0.5 ? '清晨' : '黄昏'));
  const tag = wName + ' · ' + tName;
  if (tag !== envTagCache) {
    envTagCache = tag;
    $('envTag').textContent = tag;
  }

  // 中控屏刷新（约 8Hz）
  screenT -= dt;
  if (screenT <= 0) {
    screenT = 0.12;
    drawCenterScreen(wName, tName);
  }
}

/* ===================== 输入 ===================== */
const input = { left: false, right: false, accel: false, brake: false, targetX: null };

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; e.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') { input.accel = true; e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { input.brake = true; e.preventDefault(); }
  else if ((k === 'c' || k === 'C') && !e.repeat) { e.preventDefault(); cycleCam(); }
  else if ((k === 'l' || k === 'L') && !e.repeat) { e.preventDefault(); cycleLights(); }
  else if ((k === 'f' || k === 'F') && !e.repeat) { e.preventDefault(); toggleFly(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') input.accel = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') input.brake = false;
});
window.addEventListener('blur', () => {
  input.left = false; input.right = false; input.accel = false; input.brake = false; input.targetX = null;
});

let dragging = false;
canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointerSteer(e);
});
canvas.addEventListener('pointermove', (e) => {
  if (dragging) pointerSteer(e);
});
canvas.addEventListener('pointerup', () => { dragging = false; input.targetX = null; });
canvas.addEventListener('pointercancel', () => { dragging = false; input.targetX = null; });

function pointerSteer(e) {
  if (state.phase !== 'running') return;
  const rect = canvas.getBoundingClientRect();
  const nx = clamp((e.clientX - rect.left) / (rect.width || 1), 0, 1) * 2 - 1;
  input.targetX = nx * 4.6;
}

/* 触屏按键 */
const padL = $('padL'), padR = $('padR'), padA = $('padA'), padB = $('padB');
[[padL, 'left'], [padR, 'right'], [padA, 'accel'], [padB, 'brake']].forEach(([el, dir]) => {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); input[dir] = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
    el.addEventListener(ev, () => { input[dir] = false; });
  });
});

function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

const hudCache = { score: -1, best: -1, kmh: -1, lives: -1 };

function renderHud() {
  if (hudCache.score !== state.score) {
    hudCache.score = state.score;
    $('score').textContent = fmt(state.score);
  }
  if (hudCache.best !== state.best) {
    hudCache.best = state.best;
    $('best').textContent = fmt(state.best);
  }
  const kmh = Math.round(state.speed * 3.6);
  if (hudCache.kmh !== kmh) {
    hudCache.kmh = kmh;
    $('kmh').textContent = kmh;
  }

  const n = Math.max(0, state.lives);
  if (hudCache.lives !== n) {
    hudCache.lives = n;
    const lives = $('lives');
    lives.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 'life' + (i < n ? ' on' : '');
      lives.appendChild(d);
    }
  }
}

// 车型切换：公路版 / 特斯拉飞车（内饰挂在相机上，两种车视角完全一致）
function setVehicle(v) {
  const isTesla = v === 'tesla';
  const next = isTesla ? teslaRig.group : roadRigGroup;
  if (next === player.group) return;
  const old = player.group;
  state.vehicle = v;
  next.position.copy(old.position);
  next.rotation.copy(old.rotation);
  next.visible = true;
  old.visible = false;
  player.group = next;
  next.add(beam);   // 车灯光斑跟着当前车身
  if (!isTesla) state.alt = 0;
  state.flying = false;
  $('btnFly').textContent = '起飞 · F';
  next.position.y = isTesla ? state.alt : 0;
  $('btnVehicle').textContent = '车型 · ' + (isTesla ? '特斯拉飞车' : '公路版');
  $('btnFly').style.display = isTesla ? 'block' : 'none';
}

// 起飞 / 降落切换（仅特斯拉飞车）
function toggleFly() {
  if (state.vehicle !== 'tesla' || state.phase !== 'running') return;
  state.flying = !state.flying;
  $('btnFly').textContent = state.flying ? '降落 · F' : '起飞 · F';
  Sound.cue('ui');
}

function startRun() {
  Sound.init();
  Sound.resume();
  Sound.cue('start');
  Sound.startEngine();
  resetRun();
  state.phase = 'running';
  show('home', false);
  show('settings', false);
  show('pause', false);
  show('over', false);
  show('hud', true);
  $('pad').hidden = false;
}

function togglePause() {
  if (state.phase === 'running') {
    state.phase = 'paused';
    Sound.stopEngine();
    show('pause', true);
    $('pad').hidden = true;
  } else if (state.phase === 'paused') {
    state.phase = 'running';
    Sound.startEngine();
    show('pause', false);
    $('pad').hidden = false;
  }
}

function goHome() {
  state.phase = 'home';
  Sound.stopEngine();
  Sound.cue('ui');
  show('pause', false);
  show('over', false);
  show('hud', false);
  $('pad').hidden = true;
  show('home', true);
  $('homeBest').textContent = fmt(state.best);
  resetRun();
}

  teslaCockpit.visible = tcock;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state.phase === 'running') update(dt);
  else state.time += dt;

  if (state.phase !== 'running') {
    state.inv = Math.max(0, state.inv - dt);
    // 只有「暂停 + 车内视角」才隐藏车身，主页/结算时仍要能看到车
    player.group.visible = !(state.phase === 'paused' && camMode === 3);
  }

  scrollWorld(dt);
  updateCamera(dt);
  updateCockpit();
  updateEnv(dt);
  updateSparks(dt);

  if (state.flash > 0) {
    state.flash = Math.max(0, state.flash - dt * 1.9);
    dmgEl.style.opacity = (state.flash * 0.85).toFixed(3);
  }

  Sound.engineSpeed(clamp(state.speed / MAX_SPEED, 0, 1));

  renderer.render(scene, camera);
  renderMirror();
}

resetRun();
requestAnimationFrame(frame);
window.__sceneReady = true;
// 调试钩子：控制台 __hd.setDay(0.75) 切夜晚，__hd.setWeather('rain') 切雨天
window.__hd = {
  state: state,
  weather: weather,
  cockpit: cockpit,
  setDay(t) { state.dayT = ((t % 1) + 1) % 1; },
  setWeather(n) { if (WEATHER_DEFS[n]) { weather.next = n; weather.k = 0; } }
};
</script>

<script>
setTimeout(function () {
  if (!window.__sceneReady) {
    var el = document.getElementById('err');
    if (el) el.style.display = 'grid';
  }
}, 4000);
</script>
</body>
